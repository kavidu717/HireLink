#user service port is 5001
server:
  port: 5001

spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: job-portal-user-service

 #database configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://localhost:5432/HireLink-User
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
